name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.audio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        audio: [oss, pulseaudio]

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang libncurses-dev libpulse-dev

      - name: Build
        run: |
          make -C src clean
          if [ "${{ matrix.audio }}" = oss ]; then
            make -C src USE_PA=NO CC=${{ matrix.compiler }} all
          else
            make -C src USE_PA=YES CC=${{ matrix.compiler }} all
          fi

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: qrq-${{ matrix.compiler }}-${{ matrix.audio }}
          path: src/qrq
          if-no-files-found: error

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cppcheck

      - name: Strict C17 syntax check
        run: |
          cc -std=c17 -D_POSIX_C_SOURCE=200809L -DOSS \
            '-DPREFIX="/usr"' '-DVERSION="0.3.5"' -I src \
            -Wall -Wextra -Wpedantic -Wformat=2 -Wstrict-prototypes -Werror \
            -fsyntax-only src/qrq.c src/score.c src/callbase.c src/practice.c src/oss.c

      - name: Run core unit tests
        run: make -C src USE_PA=NO check

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability --std=c99 \
            --platform=unix64 --suppress=missingIncludeSystem --quiet \
            src/qrq.c src/score.c src/callbase.c src/practice.c src/oss.c src/pulseaudio.c

  sanitizers:
    name: ASan and UBSan smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libncurses-dev

      - name: Build with AddressSanitizer and UBSan
        run: |
          make -C src clean
          make -C src USE_PA=NO CC=clang \
            CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -g' \
            LDFLAGS='-fsanitize=address,undefined' all

      - name: Smoke test the command-line path
        run: ./src/qrq -h

  windows:
    name: Windows (MSYS2 / PDCurses)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pdcurses

      - name: Build native Windows executable
        shell: msys2 {0}
        run: |
          make -C src clean
          make -C src USE_PA=NO USE_WIN32=YES CC=gcc \
            WIN32_CURSES_CFLAGS=-I/mingw64/include/pdcurses all

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: qrq-windows-x86_64
          path: src/qrq.exe
          if-no-files-found: error

  macos:
    name: macOS (Core Audio)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build native macOS executable
        run: |
          make -C src clean
          make -C src USE_PA=NO USE_CA=YES OSX_PLATFORM=YES OSX_BUNDLE=NO all
